name: Patch Places Timeout Cleanup

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/location/google-places-service.ts')
          s = p.read_text()
          old = """    if (\n      !Array.isArray(\n        data?.places,\n      )\n    ) {\n\n      return {"""
          new = """    if (\n      !Array.isArray(\n        data?.places,\n      )\n    ) {\n\n      clearTimeout(\n        timeout,\n      );\n\n      return {"""
          if old not in s:
              raise SystemExit('Places invalid-response anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/location/google-places-service.ts
          git rm .github/workflows/patch-places-timeout-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/location/google-places-service.ts
          git commit -m "修正 Places Timer 清理"
          git push