name: Patch scheduler idempotency

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reminder-tested-c2
      - name: Patch scheduler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/proactive-scheduler.ts')
          s = p.read_text(encoding='utf-8')
          old = "const groupStates = new Map<string, GroupState>();\n\n/* 防止 Scheduler tick 重疊，避免同一冷場狀態同時產生多次 Gemini / Push。 */"
          new = "const groupStates = new Map<string, GroupState>();\n\n/* 防止 Scheduler 被重複啟動，避免建立多個永久 interval 並重複呼叫外部服務。 */\nlet schedulerStarted = false;\n\n/* 防止 Scheduler tick 重疊，避免同一冷場狀態同時產生多次 Gemini / Push。 */"
          if old not in s:
              raise SystemExit('START GUARD anchor not found')
          s = s.replace(old, new, 1)
          old = ") : void {\n  const expiredBacklogCount = expireReminderBacklog();"
          new = ") : void {\n  if (schedulerStarted) {\n    console.log('[Proactive Scheduler] 已啟動，跳過重複啟動。');\n    return;\n  }\n\n  schedulerStarted = true;\n\n  const expiredBacklogCount = expireReminderBacklog();"
          if old not in s:
              raise SystemExit('FUNCTION GUARD anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/proactive-scheduler.ts
          git commit -m '防止 Scheduler 重複啟動' || exit 0
          git push origin reminder-tested-c2
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/patch-scheduler-idempotency.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '移除暫時 Scheduler 修補流程' || true
          git push origin reminder-tested-c2 || true
