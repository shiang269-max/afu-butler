name: 修補目前 API 結構

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'shiang269-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reminder-tested-c2
          fetch-depth: 0

      - name: 修補 index.ts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text(encoding='utf-8')

          old_import = "import {\n  buildStyleResponse,\n} from './styles/style-response';"
          if old_import not in s:
              raise SystemExit('找不到 style-response import 錨點')

          generator = '''\n\nasync function generateProactiveReply(type: 'good-night' | 'silence'): Promise<string> {\n  if (type === 'good-night') {\n    return buildStyleResponse('諸位，夜深了，奴才先向各位道一聲晚安。' + '若還有什麼吩咐，隨時喚奴才一聲便是。');\n  }\n\n  const response = await geminiApiManager.execute(async (managerGemini) => managerGemini.models.generateContent({\n    model: 'gemini-3.5-flash-lite',\n    contents: `\n你現在是這個家庭的「大內總管」。\n\n目前家庭群組已經連續一段時間沒有人說話。\n\n你現在要主動打破冷清。\n\n請只說一句自然、簡短、有總管性格的話。\n\n可以像是在宮門口主動探頭看看眾人是否還醒著，\n可以帶一點幽默、關心或宮廷感。\n\n不要提到：\n\n- 系統\n- 排程\n- 冷場\n- 三小時\n- 監控\n- 程式\n- AI\n\n不要說自己需要休息或要下線。\n\n不要假裝有人剛剛叫你。\n\n直接輸出要在家庭群組中說的那一句話。\n    `.trim(),\n    config: { systemInstruction: SYSTEM_INSTRUCTION },\n  }));\n\n  return response.text?.trim() || buildStyleResponse('諸位都如此安靜，奴才倒有些不習慣了。');\n}\n'''

          if 'async function generateProactiveReply(' not in s:
              s = s.replace(old_import, old_import + generator, 1)

          old_call = "const familyTargetResult = await resolveFamilyTarget(cleanedMessage, event.source.userId || '', activeCallNames, gemini);"
          new_call = "const familyTargetResult = await resolveFamilyTarget(cleanedMessage, gemini);"
          if old_call not in s:
              raise SystemExit('找不到 resolveFamilyTarget 四參數呼叫')
          s = s.replace(old_call, new_call, 1)

          old_scheduler = "  startProactiveScheduler();"
          new_scheduler = "  startProactiveScheduler(lineClient, generateProactiveReply);"
          if old_scheduler not in s:
              raise SystemExit('找不到 Scheduler 零參數呼叫')
          s = s.replace(old_scheduler, new_scheduler, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: 提交並移除暫時流程
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/fix-current-api-mismatch.yml
          git diff --cached --check
          git diff --cached -- src/index.ts
          git commit -m '修正 Scheduler 與家庭目標解析器介面' || exit 0
          git rm .github/workflows/fix-current-api-mismatch.yml
          git commit -m '移除暫時 API 修補流程'
          git push origin reminder-tested-c2
