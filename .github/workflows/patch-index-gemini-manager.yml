name: Patch index Gemini manager

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct Gemini client
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old_import = "import { GoogleGenAI } from '@google/genai';\n"
          if old_import not in s:
              raise SystemExit('GoogleGenAI import anchor not found')
          s = s.replace(old_import, '', 1)
          old_client = "const gemini = new GoogleGenAI({\n  apiKey: geminiApiKey,\n});"
          new_client = "const gemini = geminiApiManager.createClient();"
          if old_client not in s:
              raise SystemExit('direct Gemini client anchor not found')
          s = s.replace(old_client, new_client, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/index.ts
          git rm .github/workflows/patch-index-gemini-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "統一 index Gemini 請求管理"
          git push
