name: fix-bare-reminder-routing

on:
  push:
    branches:
      - reminder-tested-c2

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != '修正單獨提醒避免進入 Reminder Parser' && github.event.head_commit.message != '移除臨時 Reminder 修正工作流'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reminder-tested-c2
          fetch-depth: 0
      - name: 修正
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/reminder-handler.ts')
          s = p.read_text(encoding='utf-8')
          old = """  const hasReminderIntent =\n    mayBeReminder(normalizedMessage);"""
          new = """  const hasReminderIntent =\n    mayBeReminder(normalizedMessage) &&\n    !/^提醒[，,。！？!?]*$/u.test(normalizedMessage);"""
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: 提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reminder-handler.ts
          git commit -m '修正單獨提醒避免進入 Reminder Parser'
          git push origin reminder-tested-c2
