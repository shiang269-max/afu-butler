name: optimize family resolver

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reminder-tested-c2
          fetch-depth: 0
      - name: Patch resolver routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/index.ts')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"(?m)^\s*const wantsAll = ALL_TARGET_WORDS\.some\(\(word\) => cleanedMessage\.includes\(word\)\);\n\s*const resolvedFamilyTarget = wantsAll \? null : await resolveFamilyTarget\(cleanedMessage, gemini\);\n\s*const familyTarget = wantsAll \? \{ type: 'all' as const \} : resolvedFamilyTarget \? \{ type: 'user' as const, \.\.\.resolvedFamilyTarget \} : null;\n")
          replacement = """          const wantsAll = ALL_TARGET_WORDS.some((word) => cleanedMessage.includes(word));
          const hasFamilyTargetIntent = hasFamilyTargetIntentForResolver(cleanedMessage);
          const resolvedFamilyTarget = wantsAll || !hasFamilyTargetIntent
            ? null
            : await resolveFamilyTarget(cleanedMessage, gemini);
          const familyTarget = wantsAll ? { type: 'all' as const } : resolvedFamilyTarget ? { type: 'user' as const, ...resolvedFamilyTarget } : null;
"""
          if not pattern.search(s):
              raise SystemExit('resolver block not found')
          s = pattern.sub(replacement, s, count=1)
          helper = """
function hasFamilyTargetIntentForResolver(message: string): boolean {
  const text = message.trim();
  if (!text) return false;
  const hasKnownFamilyMember = Object.values(FAMILY_MEMBERS).some((member: any) => {
    const identity = typeof member?.identity === 'string' ? member.identity : '';
    const mentionName = typeof member?.mentionName === 'string' ? member.mentionName : '';
    return (identity && text.includes(identity)) || (mentionName && text.includes(mentionName));
  });
  if (hasKnownFamilyMember) return true;
  return FAMILY_TARGET_ACTION_WORDS.some((word) => text.includes(word));
}
"""
          marker = "function hasReminderInvocation(message: string): boolean {"
          if 'function hasFamilyTargetIntentForResolver' not in s:
              if marker not in s:
                  raise SystemExit('insert marker not found')
              s = s.replace(marker, helper + "\n" + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '避免普通對話重複呼叫家庭成員解析'
          git push origin reminder-tested-c2
