name: optimize family resolver

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reminder-tested-c2
          fetch-depth: 0
      - name: Patch resolver routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text(encoding='utf-8')
          old = """          const wantsAll = ALL_TARGET_WORDS.some((word) => cleanedMessage.includes(word));\n          const resolvedFamilyTarget = wantsAll ? null : await resolveFamilyTarget(cleanedMessage, gemini);\n          const familyTarget = wantsAll ? { type: 'all' as const } : resolvedFamilyTarget ? { type: 'user' as const, ...resolvedFamilyTarget } : null;\n"""
          new = """          const wantsAll = ALL_TARGET_WORDS.some((word) => cleanedMessage.includes(word));\n          const hasFamilyTargetIntent = hasFamilyTargetIntentForAi(cleanedMessage);\n          const resolvedFamilyTarget = wantsAll || !hasFamilyTargetIntent\n            ? null\n            : await resolveFamilyTarget(cleanedMessage, gemini);\n          const familyTarget = wantsAll ? { type: 'all' as const } : resolvedFamilyTarget ? { type: 'user' as const, ...resolvedFamilyTarget } : null;\n"""
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          marker = "function hasFamilyTargetIntent(message: string): boolean {"
          if marker not in s:
              insert_at = s.index("function hasFamilyTargetIntent") if "function hasFamilyTargetIntent" in s else -1
              if insert_at < 0:
                  raise SystemExit('family target helper not found')
          # Reuse existing helper under a local name without changing its semantics.
          s = s.replace('hasFamilyTargetIntentForAi(cleanedMessage)', 'hasFamilyTargetIntent(cleanedMessage)', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git diff --cached --exit-code && exit 0 || true
          git commit -m '避免普通對話重複呼叫家庭成員解析'
          git push origin reminder-tested-c2
