name: Build 驗證

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor == 'shiang269-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝相依套件
        run: npm install
      - name: TypeScript Build
        run: npm run build
      - name: 移除暫時驗證流程
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-build.yml
          git commit -m '移除暫時 Build 驗證流程' || true
          git push origin reminder-tested-c2 || true
