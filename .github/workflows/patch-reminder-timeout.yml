name: Patch Reminder Timeout

on:
  push:
    branches: [reminder-tested-c2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/reminder-handler.ts')
          s = p.read_text()
          old = """  const timeoutMs = 20_000;\n\n  return Promise.race(["""
          new = """  const timeoutMs = 20_000;\n  let timeout: ReturnType<typeof setTimeout> | undefined;\n\n  try {\n    return await Promise.race(["""
          if old not in s:
              raise SystemExit('timeout block anchor not found')
          s = s.replace(old, new, 1)
          old = """    new Promise<ReminderParseResult>(\n      (_, reject) => {\n        setTimeout("""
          new = """    new Promise<ReminderParseResult>(\n      (_, reject) => {\n        timeout = setTimeout("""
          if old not in s:
              raise SystemExit('timer anchor not found')
          s = s.replace(old, new, 1)
          old = """      },\n    ),\n  ]);\n}"""
          new = """      },\n    ),\n    ]);\n  } finally {\n    if (timeout) clearTimeout(timeout);\n  }\n}"""
          if old not in s:
              raise SystemExit('race closing anchor not found')
          s = s.replace(old, new, 1)
          old = """    config: { temperature: 0 },\n  });"""
          new = """    config: {\n      temperature: 0,\n      httpOptions: { timeout: 15_000 },\n    },\n  });"""
          if old not in s:
              raise SystemExit('Gemini config anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/reminder-handler.ts
          git rm .github/workflows/patch-reminder-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reminder-handler.ts
          git commit -m "修正 Reminder Gemini 請求生命週期"
          git push